name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v3.2.4
        with:
          enable-cache: true
      - name: Build C runtime
        run: make -C runtime
      - name: Install Python deps via uv
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v
