name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Supported: Python 3.11-3.13 (pyproject requires >= 3.11) on Linux
        # and macOS; every version on Linux, the pinned one on macOS.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          # Programs build at -O2 by default (spec 70); keep -O0 covered.
          - os: ubuntu-latest
            python: "3.12"
            opt: "0"
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, py${{ matrix.python }}${{ matrix.opt && format(', O{0}', matrix.opt) || '' }})
    env:
      UV_PYTHON: ${{ matrix.python }}
      RW_OPT_LEVEL: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Boehm GC
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bdw-gc; else sudo apt-get update && sudo apt-get install -y libgc-dev; fi
      - name: Build C runtime
        run: make -C runtime
      - name: Install Python deps via uv
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v
