name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tagpr needs full history to derive the next version from
          # the existing tags and the commits since the latest one.
          fetch-depth: 0
      - uses: Songmu/tagpr@v1
        env:
          # tagpr reads GITHUB_TOKEN from the environment, not from
          # `with:`. The default token granted to the workflow has
          # the permissions we requested above (contents + PRs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
