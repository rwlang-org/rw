name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tagpr needs full history to derive the next version from
          # the existing tags and the commits since the latest one.
          fetch-depth: 0
      - uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        env:
          # tagpr reads GITHUB_TOKEN from the environment, not from
          # `with:`. The default token granted to the workflow has
          # the permissions we requested above (contents + PRs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
