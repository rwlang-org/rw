name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tagpr needs full history to derive the next version from
          # the existing tags and the commits since the latest one.
          fetch-depth: 0
      - uses: Songmu/tagpr@812f0c28980cb9a1e5cf427b65c1ac6a1d2b4377 # v1.6.1
        env:
          # tagpr reads GITHUB_TOKEN from the environment, not from
          # `with:`. The default token granted to the workflow has
          # the permissions we requested above (contents + PRs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
