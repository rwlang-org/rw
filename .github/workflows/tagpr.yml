name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tagpr needs full history to derive the next version from
          # the existing tags and the commits since the latest one.
          fetch-depth: 0
      - uses: Songmu/tagpr@v1
