name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # tagpr needs full history to derive the next version from
          # the existing tags and the commits since the latest one.
          fetch-depth: 0
      - uses: Songmu/tagpr@1ed622d3ec96f7f37e7c2b5b3a6c39ace31ee8eb # v1.6.1
        env:
          # tagpr reads GITHUB_TOKEN from the environment, not from
          # `with:`. The default token granted to the workflow has
          # the permissions we requested above (contents + PRs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
