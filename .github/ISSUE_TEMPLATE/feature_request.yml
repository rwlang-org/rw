name: 機能要望
description: 新機能・改善の提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能・改善提案ありがとうございます。
        大きめの設計提案の場合は RFC テンプレートの利用もご検討ください。
  - type: textarea
    id: motivation
    attributes:
      label: 背景・モチベーション
      description: なぜこの機能が必要なのか、現状の課題は何かを記述してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: 具体的な機能内容、想定される API / 構文 / 挙動などを記述してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他のアプローチがあれば記載してください。
  - type: textarea
    id: scope
    attributes:
      label: 影響範囲
      description: "影響する領域 (lang / runtime / stdlib / tooling など) を記載してください。"
      placeholder: "例: lang (parser, type checker), runtime (netpoller)"
