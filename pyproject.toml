[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw"
version = "0.0.4"
description = "rw: a Python-flavored, async-first, statically-typed compiled language"
requires-python = ">=3.11"
dependencies = [
    "llvmlite>=0.42,<0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7,<1",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
]

[project.scripts]
rwc = "rwc.cli:main"

[tool.setuptools.packages.find]
include = ["rwc*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# strict は段階的に有効化する方針。
# 個別モジュールへ override を追加して順次厳格化していく。
